name: Build Xpra AppImage

on:
  workflow_dispatch:
    inputs:
      xpra_repo:
        description: 'Which Xpra repo to build from'
        required: true
        default: 'official'
        type: choice
        options:
          - official
          - c0xc-fork
      ref:
        description: 'Git tag or branch to check out'
        required: false
        default: 'master'
  push:
    branches:
      - master
      - test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
      - name: Print env
        run: |
          echo "[GH runner]"
          df -h
          pwd
          ls -la
      - name: Fix workspace permissions
        run: sudo chmod 777 ${{ github.workspace }}
      - name: Run build script
        run: |
          docker build -f Dockerfile.centos8 -t xpra-appimg-builder-centos8 .
          USE_FORK=false
          FORK_REPO_URL=""
          if [ "${{ github.event.inputs.xpra_repo }}" = "c0xc-fork" ]; then
            USE_FORK=true
            FORK_REPO_URL="https://github.com/c0xc/xpra.git"
          fi
          docker run --rm \
            -e USE_FORK="$USE_FORK" \
            -e FORK_REPO_URL="$FORK_REPO_URL" \
            -e REPO_BRANCH="${{ github.event.inputs.ref }}" \
            -v ${{ github.workspace }}:/workspace xpra-appimg-builder-centos8
          df -h
          pwd
          ls -la
          echo "[GH runner] Build complete"
          ls -ld ${{ github.workspace }}
          ls -lAh ${{ github.workspace }}/build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpra-appimage
          path: ${{ github.workspace }}/build/Xpra-x86_64.AppImage
